# Every parameter shape the generator supports, as a cookie. A cookie reaches the handler
# as a string exactly like a query or header value, and it took the same branch that used
# to skip coercion entirely, so every non-string one rejected its own input.
#
# A cookie value is percent-encoded by the client, which is how `emoji` and `mac` travel
# in a `Cookie:` header. `format: binary` is absent because it emits `z.file()`.
#
# `/cookies`   every shape, each optional so a test sends one alone. `ids` is the array
#              axis: a cookie name appears once, so it always arrives as a single value.
# `/optional`  absent cookies, literals, constraints and odd names.
# `/defaults`  what an absent cookie falls back to.
# `/required`  what happens when a required cookie is missing.
#
# 生成器が対応するすべてのパラメータ形状を、Cookie として宣言する。Cookie も、クエリや
# ヘッダーの値と同じく文字列としてハンドラに届く。かつて coerce を完全にスキップしていた
# 分岐を通るため、文字列以外の形状はすべて、自身の入力を拒否していた。
#
# Cookie の値は、クライアントによってパーセントエンコードされる。`emoji` や `mac` を
# `Cookie:` ヘッダーで運べるのは、そのためである。`format: binary` は、`z.file()` として
# 生成されるため含めていない。
#
# `/cookies`   全形状。テストで1つだけ送信できるよう、すべて任意にしている。`ids` は配列の
#              軸である。Cookie 名は1度しか現れないため、常に単一値として届く。
# `/optional`  省略された Cookie、リテラル、制約、および特殊な名前。
# `/defaults`  省略された Cookie に適用されるデフォルト値。
# `/required`  必須 Cookie が欠落している場合の挙動。
openapi: 3.1.0
info:
  title: Cookie Parameter Matrix
  version: 0.0.0
paths:
  /cookies:
    get:
      operationId: cookieParams
      parameters:
        - { name: integer, in: cookie, schema: { type: integer } }
        - { name: int32, in: cookie, schema: { type: integer, format: int32 } }
        - { name: int64, in: cookie, schema: { type: integer, format: int64 } }
        - { name: bigint, in: cookie, schema: { type: integer, format: bigint } }
        - { name: uint32, in: cookie, schema: { type: integer, format: uint32 } }
        - { name: uint64, in: cookie, schema: { type: integer, format: uint64 } }
        - { name: number, in: cookie, schema: { type: number } }
        - { name: float, in: cookie, schema: { type: number, format: float } }
        - { name: float32, in: cookie, schema: { type: number, format: float32 } }
        - { name: float64, in: cookie, schema: { type: number, format: float64 } }
        - { name: double, in: cookie, schema: { type: number, format: double } }
        - { name: numpassword, in: cookie, schema: { type: number, format: password } }
        - { name: boolean, in: cookie, schema: { type: boolean } }
        - { name: string, in: cookie, schema: { type: string } }
        - { name: email, in: cookie, schema: { type: string, format: email } }
        - { name: uuid, in: cookie, schema: { type: string, format: uuid } }
        - { name: uuidv4, in: cookie, schema: { type: string, format: uuidv4 } }
        - { name: uuidv7, in: cookie, schema: { type: string, format: uuidv7 } }
        - { name: url, in: cookie, schema: { type: string, format: url } }
        - { name: uri, in: cookie, schema: { type: string, format: uri } }
        - { name: httpurl, in: cookie, schema: { type: string, format: httpUrl } }
        - { name: hostname, in: cookie, schema: { type: string, format: hostname } }
        - { name: hex, in: cookie, schema: { type: string, format: hex } }
        - { name: emoji, in: cookie, schema: { type: string, format: emoji } }
        - { name: base64, in: cookie, schema: { type: string, format: base64 } }
        - { name: base64url, in: cookie, schema: { type: string, format: base64url } }
        - { name: nanoid, in: cookie, schema: { type: string, format: nanoid } }
        - { name: cuid2, in: cookie, schema: { type: string, format: cuid2 } }
        - { name: ulid, in: cookie, schema: { type: string, format: ulid } }
        - { name: ipv4, in: cookie, schema: { type: string, format: ipv4 } }
        - { name: ipv6, in: cookie, schema: { type: string, format: ipv6 } }
        - { name: cidrv4, in: cookie, schema: { type: string, format: cidrv4 } }
        - { name: cidrv6, in: cookie, schema: { type: string, format: cidrv6 } }
        - { name: date, in: cookie, schema: { type: string, format: date } }
        - { name: time, in: cookie, schema: { type: string, format: time } }
        - { name: datetime, in: cookie, schema: { type: string, format: date-time } }
        - { name: duration, in: cookie, schema: { type: string, format: duration } }
        - { name: byte, in: cookie, schema: { type: string, format: byte } }
        - { name: strpassword, in: cookie, schema: { type: string, format: password } }
        - { name: mac, in: cookie, schema: { type: string, format: mac } }
        - { name: e164, in: cookie, schema: { type: string, format: e164 } }
        - { name: creditcard, in: cookie, schema: { type: string, format: creditCard } }
        - { name: iban, in: cookie, schema: { type: string, format: iban } }
        - { name: currencycode, in: cookie, schema: { type: string, format: currencyCode } }
        - { name: ksuid, in: cookie, schema: { type: string, format: ksuid } }
        - { name: xid, in: cookie, schema: { type: string, format: xid } }
        - { name: guid, in: cookie, schema: { type: string, format: guid } }
        - { name: trim, in: cookie, schema: { type: string, format: trim } }
        - { name: ids, in: cookie, schema: { type: array, items: { type: integer } } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /optional:
    get:
      operationId: cookieOptional
      parameters:
        - { name: int_opt, in: cookie, schema: { type: integer } }
        - { name: int64_opt, in: cookie, schema: { type: integer, format: int64 } }
        - { name: bool_opt, in: cookie, schema: { type: boolean } }
        - { name: str_opt, in: cookie, schema: { type: string } }
        - { name: ienum, in: cookie, schema: { type: integer, enum: [1, 2, 3] } }
        - { name: benum, in: cookie, schema: { type: boolean, enum: [true] } }
        - { name: iconst, in: cookie, schema: { type: integer, const: 7 } }
        - { name: senum, in: cookie, schema: { type: string, enum: [asc, desc] } }
        - {
            name: ioneof,
            in: cookie,
            schema: { oneOf: [{ type: integer }, { type: string, enum: [all] }] },
          }
        - { name: range, in: cookie, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: length, in: cookie, schema: { type: string, minLength: 2, maxLength: 4 } }
        - { name: pattern, in: cookie, schema: { type: string, pattern: '^[a-z]+-\d{1,3}$' } }
        # A schema behind `$ref`: the component is written for a typed value.
        # `$ref` の先にあるスキーマ。コンポーネントは型付きの値を前提としている。
        - { name: ref_int, in: cookie, schema: { $ref: '#/components/schemas/Count' } }
        # An object explodes by default: each property is a cookie of its own, theme=dark;
        # size=5. With `explode: false` one cookie holds names and values, a,1,b,x.
        # オブジェクトは、デフォルトで explode される。各プロパティが独立した Cookie になる
        # (theme=dark; size=5)。`explode: false` では、1つの Cookie が名前と値を保持する
        # (a,1,b,x)。
        - {
            name: prefs,
            in: cookie,
            schema:
              { type: object, properties: { theme: { type: string }, size: { type: integer } } },
          }
        - {
            name: obj,
            in: cookie,
            explode: false,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
        - { name: tx_lower, in: cookie, schema: { type: string, x-toLowerCase: true } }
        - {
            name: tx_email,
            in: cookie,
            schema: { type: string, format: email, x-toLowerCase: true },
          }
        # Names that are not JavaScript identifiers, and one that differs by case alone.
        # JavaScript の識別子でない名前と、大文字小文字だけが異なる名前。
        - { name: session-id, in: cookie, schema: { type: integer } }
        - { name: user.id, in: cookie, schema: { type: integer } }
        - { name: Int_Opt, in: cookie, schema: { type: string } }
        # `null` has no spelling of its own in a parameter; the text `null` is read as the value
        # by a schema that takes `null` and no string.
        # パラメータには `null` 専用の表記がない。`null` を受理し、文字列を受理しないスキーマは、
        # テキスト `null` を値として読む。
        - { name: inull, in: cookie, schema: { type: [integer, 'null'] } }
        # A name every JavaScript object inherits: the request object answers to it whether
        # the parameter was sent or not.
        # すべての JavaScript オブジェクトが継承する名前。パラメータが送信されたかどうかに
        # かかわらず、リクエストオブジェクトはこの名前に応答する。
        - { name: constructor, in: cookie, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /defaults:
    get:
      operationId: cookieDefaults
      parameters:
        - { name: int_def, in: cookie, schema: { type: integer, default: 20 } }
        - { name: int64_def, in: cookie, schema: { type: integer, format: int64, default: 5 } }
        - { name: bool_def, in: cookie, schema: { type: boolean, default: false } }
        - { name: str_def, in: cookie, schema: { type: string, default: fallback } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /required:
    get:
      operationId: cookieRequired
      parameters:
        - { name: id, in: cookie, required: true, schema: { type: integer } }
        - { name: big, in: cookie, required: true, schema: { type: integer, format: int64 } }
        - { name: flag, in: cookie, required: true, schema: { type: boolean } }
        - { name: name, in: cookie, required: true, schema: { type: string } }
        - { name: note, in: cookie, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
components:
  schemas:
    Count:
      type: integer
      minimum: 0
  responses:
    Fields:
      description: Every validated parameter, by name, as the runtime typeof and the text of its value.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
