# Every parameter shape the generator supports, as a path parameter: one route each, so a
# shape that rejects its own value fails on its own. Path values are always single and
# always required, which is the axis `query-params` cannot cover.
#
# `format: binary` is deliberately absent: it emits `z.file()`, which a URL cannot carry.
#
# The `tx*` routes are the second axis: the `x-toLowerCase` / `x-toUpperCase` /
# `x-normalize` extensions, alone and paired with a validation format — the pairing takes a
# `.pipe()` branch so the transform runs before the format's own check.
#
# The third axis is constraints (`minimum`, `maxLength`, `pattern`, ...): a constraint on a
# numeric parameter has to apply to the coerced value, not to the text of the segment.
#
# The last axis is how a parameter is declared rather than what it holds: several in one
# path, a name that is not an identifier, a `$ref`, and a declaration shared by every
# operation of a path item.
#
# 生成器が対応するすべてのパラメータ形状を、パスパラメータとして宣言する。形状ごとに
# ルートを1つ用意しているため、自身の値を拒否する形状は、単独で失敗する。パスの値は常に
# 単一かつ必須であり、これは `query-params` では検証できない軸である。
#
# `format: binary` は意図的に含めていない。`z.file()` として生成されるが、URL では運べない。
#
# `tx*` のルートは2つ目の軸である。`x-toLowerCase` / `x-toUpperCase` / `x-normalize` 拡張を、
# 単独の場合と、検証フォーマットと組み合わせた場合の両方で検証する。組み合わせた場合は
# `.pipe()` の分岐を通り、変換がフォーマット検証より先に実行される。
#
# 3つ目の軸は制約(`minimum`・`maxLength`・`pattern` など)である。数値パラメータの制約は、
# セグメントの文字列ではなく、coerce 後の値に適用されなければならない。
#
# 最後の軸は、パラメータの中身ではなく宣言方法である。1つのパスに複数のパラメータがある
# 場合、識別子でない名前、`$ref`、パスアイテムの全オペレーションで共有される宣言を検証する。
openapi: 3.1.0
info:
