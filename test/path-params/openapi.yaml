  /trim/{value}:
    get:
      operationId: trimParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, format: trim } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- transform extensions ----
  # ---- 変換用の拡張 ----
  /txlower/{value}:
    get:
      operationId: txlowerParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, x-toLowerCase: true } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /txupper/{value}:
    get:
      operationId: txupperParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, x-toUpperCase: true } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /txnormalize/{value}:
    get:
      operationId: txnormalizeParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, x-normalize: NFKC } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /txemail/{value}:
    get:
      operationId: txemailParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: string, format: email, x-toLowerCase: true },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- literals ----
  # ---- リテラル ----
  # A numeric or boolean `enum` / `const` names a typed value; the segment is text.
  # 数値・真偽値の `enum` / `const` は型付きの値を指すが、セグメントは文字列である。
  /ienum/{value}:
    get:
      operationId: ienumParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: integer, enum: [1, 2] } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /nenum/{value}:
    get:
      operationId: nenumParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: number, enum: [0.5, 2.5] } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /benum/{value}:
    get:
      operationId: benumParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: boolean, enum: [true] } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /iconst/{value}:
    get:
      operationId: iconstParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: integer, const: 7 } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /senum/{value}:
    get:
      operationId: senumParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /sconst/{value}:
    get:
      operationId: sconstParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, const: fixed } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # A string enum whose members look like numbers and booleans must stay text.
  # 数値や真偽値に見えるメンバーを持つ string enum は、文字列のままでなければならない。
  /numericsenum/{value}:
    get:
      operationId: numericsenumParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: string, enum: ['1', '02', 'true'] },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- constraints ----
  # ---- 制約 ----
  /range/{value}:
    get:
      operationId: rangeParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1, maximum: 10 },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /exclusive/{value}:
    get:
      operationId: exclusiveParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /multiple/{value}:
    get:
      operationId: multipleParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: integer, multipleOf: 5 } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /int64range/{value}:
    get:
      operationId: int64rangeParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: integer, format: int64, minimum: 1, maximum: 100 },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /length/{value}:
    get:
      operationId: lengthParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 4 },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /pattern/{value}:
    get:
      operationId: patternParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z]+-\d{1,3}$' },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- combinators ----
  # ---- コンビネータ ----
  /oneof/{value}:
    get:
      operationId: oneofParam
      parameters:
        - name: value
          in: path
          required: true
          schema:
            oneOf:
              - { type: integer }
              - { type: string, enum: [all] }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /schemaref/{value}:
    get:
      operationId: schemarefParam
      parameters:
        - { name: value, in: path, required: true, schema: { $ref: '#/components/schemas/Count' } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- serialisation styles ----
  # ---- シリアライズ形式 ----
  # `style: simple` is the default of a path parameter: an array is one segment holding
  # comma-separated values. `label` puts a "." in front and `matrix` a ";name=", on a scalar
  # as much as on an array; with `explode: true` the prefix separates the elements as well.
  # `style: simple` はパスパラメータのデフォルトである。配列は、値をカンマ区切りで並べた
  # 1つのセグメントになる。`label` は先頭に "." を、`matrix` は ";name=" を付ける。これは
  # スカラーでも配列でも同じである。`explode: true` では、その接頭辞が要素の区切りも兼ねる。
  /simplearr/{value}:
    get:
      operationId: simplearrParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: array, items: { type: integer } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /simplestrarr/{value}:
    get:
      operationId: simplestrarrParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: array, items: { type: string } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /label/{value}:
    get:
      operationId: labelParam
      parameters:
        - { name: value, in: path, required: true, style: label, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /labelarr/{value}:
    get:
      operationId: labelarrParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: label,
            schema: { type: array, items: { type: integer } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /labelexplode/{value}:
    get:
      operationId: labelexplodeParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: label,
            explode: true,
            schema: { type: array, items: { type: integer } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /matrix/{value}:
    get:
      operationId: matrixParam
      parameters:
        - { name: value, in: path, required: true, style: matrix, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /matrixarr/{value}:
    get:
      operationId: matrixarrParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: matrix,
            schema: { type: array, items: { type: integer } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /matrixexplode/{value}:
    get:
      operationId: matrixexplodeParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: matrix,
            explode: true,
            schema: { type: array, items: { type: integer } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- objects ----
  # ---- オブジェクト ----
  # An object is one segment too. `style: simple` alternates names and values, a,1,b,x, and
  # with `explode: true` writes assignments, a=1,b=x. `label` and `matrix` put their prefix
  # in front; exploded, `label` separates the assignments with "." and `matrix` with ";".
  # オブジェクトも、1つのセグメントになる。`style: simple` は名前と値を交互に並べ
  # (a,1,b,x)、`explode: true` では代入の形で書く(a=1,b=x)。`label` と `matrix` は、
  # それぞれの接頭辞を先頭に付ける。explode された場合、`label` は代入同士を "." で、
  # `matrix` は ";" で区切る。
  /simpleobj/{value}:
    get:
      operationId: simpleobjParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /simpleobjx/{value}:
    get:
      operationId: simpleobjxParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            explode: true,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /labelobjx/{value}:
    get:
      operationId: labelobjxParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: label,
            explode: true,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /matrixobj/{value}:
    get:
      operationId: matrixobjParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: matrix,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /matrixobjx/{value}:
    get:
      operationId: matrixobjxParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            style: matrix,
            explode: true,
            schema: { type: object, properties: { a: { type: integer }, b: { type: string } } },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- combinators read once ----
  # ---- 1度だけ読み取られるコンビネータ ----
  /allof/{value}:
    get:
      operationId: allofParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { allOf: [{ type: integer }, { minimum: 5 }] },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /oneofis/{value}:
    get:
      operationId: oneofisParam
      parameters:
        - {
            name: value,
            in: path,
            required: true,
            schema: { oneOf: [{ type: integer }, { type: string }] },
          }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # ---- declaration forms ----
  # ---- 宣言の形式 ----
  /orgs/{orgId}/repos/{repoId}/issues/{issueId}:
    get:
      operationId: multiParam
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
        - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: issueId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  # Neither name is a JavaScript identifier, nor a Hono `:name` without care.
  # どちらの名前も JavaScript の識別子ではなく、Hono の `:name` としても注意が必要である。
  /named/{user-id}/{post_id}:
    get:
      operationId: namedParam
      parameters:
        - { name: user-id, in: path, required: true, schema: { type: integer } }
        - { name: post_id, in: path, required: true, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /paramref/{id}:
    get:
      operationId: paramrefParam
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # Declared once on the path item, inherited by every operation under it.
  # パスアイテムで1度だけ宣言し、配下のすべてのオペレーションが継承する。
  /shared/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: sharedGetParam
      responses:
        '200': { $ref: '#/components/responses/Echo' }
    delete:
      operationId: sharedDeleteParam
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  # The operation's own declaration replaces the path item's for the same name.
  # 同名の場合、オペレーション自身の宣言が、パスアイテムの宣言を置き換える。
  /override/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: overrideParam
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
components:
  schemas:
    Count:
      type: integer
      minimum: 0
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Echo:
      description: The runtime typeof the path parameter, and its value verbatim.
      content:
        application/json:
          schema:
            type: object
            required: [valueType, valueText]
            properties:
              valueType: { type: string }
              valueText: { type: string }
    Fields:
      description: The runtime typeof and the verbatim value of each path parameter, by name.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              required: [valueType, valueText]
              properties:
                valueType: { type: string }
                valueText: { type: string }
