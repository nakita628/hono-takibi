  /datetime/{value}:
    get:
      operationId: datetimeParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /duration/{value}:
    get:
      operationId: durationParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, format: duration } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /byte/{value}:
    get:
      operationId: byteParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, format: byte } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /strpassword/{value}:
    get:
      operationId: strpasswordParam
      parameters:
        - { name: value, in: path, required: true, schema: { type: string, format: password } }
      responses:
        '200': { $ref: '#/components/responses/Echo' }
  /mac/{value}:
    get:
      operationId: macParam
      parameters:
