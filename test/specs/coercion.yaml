openapi: 3.1.0
info:
  title: Integration Coercion API
  version: 0.0.0
paths:
  /coerce/{id}:
    get:
      operationId: coercePathId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Coerced path param echo
          content:
            application/json:
              schema:
                type: object
                required:
                  - idType
                  - idValue
                properties:
                  idType:
                    type: string
                  idValue:
                    type: string
  /search:
    get:
      operationId: search
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: active
          in: query
          required: true
          schema:
            type: boolean
        - name: ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: big
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: bigs
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: ratio
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Coerced query echo
          content:
            application/json:
              schema:
                type: object
                required:
                  - limit
                  - limitType
                  - activeType
                  - idsTypes
                properties:
                  limit:
                    type: number
                  limitType:
                    type: string
                  activeType:
                    type: string
                  idsTypes:
                    type: array
                    items:
                      type: string
                  bigType:
                    type: string
                  bigValue:
                    type: string
                  bigsTypes:
                    type: array
                    items:
                      type: string
                  ratioType:
                    type: string
  /headers:
    get:
      operationId: coerceHeaders
      parameters:
        - name: x-count
          in: header
          required: true
          schema:
            type: integer
        - name: x-flag
          in: header
          required: true
          schema:
            type: boolean
        - name: x-big
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: ratios
          in: query
          required: false
          schema:
            type: array
            items:
              type: number
              format: double
      responses:
        '200':
          description: Coerced header echo
          content:
            application/json:
              schema:
                type: object
                required:
                  - countType
                  - flagType
                  - bigType
                  - bigValue
                properties:
                  countType:
                    type: string
                  flagType:
                    type: string
                  bigType:
                    type: string
                  bigValue:
                    type: string
                  ratiosTypes:
                    type: array
                    items:
                      type: string
