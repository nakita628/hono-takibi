openapi: 3.1.0
info:
  title: Integration Users API
  version: 0.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-trace
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /items:
    get:
      operationId: listItems
      x-pagination: true
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Item page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
  /slow:
    get:
      operationId: getSlow
      responses:
        '200':
          description: Delayed response
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    UserInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ItemPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: string
        nextPage:
          type: integer
