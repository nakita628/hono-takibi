openapi: 3.1.0
info:
  title: Mock edge cases
  version: 1.0.0
  description: >-
    Shapes the mock generator must emit valid, schema-satisfying code for:
    non-identifier property and component names, property-name hints that
    disagree with the declared type, OpenAPI 3.1 type arrays, config/spec
    array-bound conflicts, maps, schema-level examples and every string format
    the zod generator validates.
security:
  - ApiKeyAuth: []
paths:
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User-Profile'
        '401':
          description: Missing API key
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /formats:
    get:
      operationId: getFormats
      security: []
      responses:
        '200':
          description: One value per string format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formats'
  # Prism-compatible `Prefer: code=…, example=…` selection across every kind of
  # declared response: named examples, problem+json, a 4XX range, default.
  /orders/{orderId}:
    get:
      operationId: getOrder
      security: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                shipped:
                  $ref: '#/components/examples/ShippedOrder'
                pending:
                  value: { id: o-2, state: pending }
        '404':
          description: No such order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gone:
                  value: { title: Order deleted, status: 404 }
        '4XX':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Maintenance
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  # Bounds declared on one side only, exclusive bounds and unique items: the
  # side the spec leaves open must not invert the range faker draws from.
  /bounds:
    get:
      operationId: getBounds
      security: []
      responses:
        '200':
          description: One value per one-sided bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bounds'
  # A schema that refers to itself, directly and through an array.
  /categories:
    get:
      operationId: getCategories
      security: []
      responses:
        '200':
          description: A category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  # A map whose values are a component schema.
  /settings:
    get:
      operationId: getSettings
      security: []
      responses:
        '200':
          description: Settings by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
  # A 401 that declares its own body.
  /session:
    get:
      operationId: getSession
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  # An authored example for a schema with an int64 member.
  /invoices:
    get:
      operationId: getInvoices
      security: []
      responses:
        '200':
          description: An invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example: { id: 123, lines: [{ amount: 45 }], note: paid }
  # A required member without a type, a tuple, and a pattern with a length.
  /shapes:
    get:
      operationId: getShapes
      security: []
      responses:
        '200':
          description: One value per shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shapes'
  # Both schemes of one requirement are needed.
  /vault:
    get:
      operationId: getVault
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: The vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '401':
          description: Missing credentials
  # An empty requirement allows an anonymous call.
  /feed:
    get:
      operationId: getFeed
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: The feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '401':
          description: Missing API key
  # A response schema that declares no type.
  /anything:
    get:
      operationId: getAnything
      security: []
      responses:
        '200':
          description: Any JSON value
          content:
            application/json:
              schema: {}
  # allOf that makes a member of a referenced schema required.
  /contacts:
    get:
      operationId: getContacts
      security: []
      responses:
        '200':
          description: A contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
  # A schema that refers to itself from inside a oneOf.
  /graph:
    get:
      operationId: getGraph
      security: []
      responses:
        '200':
          description: A graph node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNode'
  # A component schema that only says what the value is not.
  /not-a-string:
    get:
      operationId: getNotAString
      security: []
      responses:
        '200':
          description: Anything but a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAString'
  # A media type referenced from components.mediaTypes (OpenAPI 3.2).
  /people:
    get:
      operationId: getPeople
      security: []
      responses:
        '200':
          description: People
          content:
            application/json:
              $ref: '#/components/mediaTypes/PeopleJson'
  # A path item referenced from components.pathItems.
  /status:
    $ref: '#/components/pathItems/Status'
  # Constraints hono-takibi reads from vendor extensions and JSON Schema keywords.
  /constraints:
    get:
      operationId: getConstraints
      security: []
      responses:
        '200':
          description: One value per constraint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Constraints'
  # A oneOf whose variants overlap: every Member is also an Organization.
  /parties:
    get:
      operationId: getParties
      security: []
      responses:
        '200':
          description: A party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
  # A cycle through an optional array and a required reference.
  /accounts:
    get:
      operationId: getAccounts
      security: []
      responses:
        '200':
          description: An account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
components:
  pathItems:
    Status:
      get:
        operationId: getStatus
        security: []
        responses:
          '200':
            description: The status
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Setting'
  mediaTypes:
    PeopleJson:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Person'
  examples:
    ShippedOrder:
      value: { id: o-1, state: shipped }
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    User-Profile:
      type: object
      required:
        - first-name
        - user.name
        - full name
        - 1st
        - status
        - createdAt
        - created_at
        - type
        - price
        - nickname
        - tags
        - labels
        - role
        - bio
        - code
      properties:
        first-name:
          type: string
        user.name:
          type: string
        full name:
          type: string
        1st:
          type: integer
        # Property-name hints (status/createdAt/type/price) would emit a
        # string or a float; the declared integer type wins.
        status:
          type: integer
          minimum: 100
          maximum: 599
        createdAt:
          type: integer
        created_at:
          type: string
          format: date-time
        type:
          type: integer
        price:
          type: integer
        nickname:
          type: [string, 'null']
        age:
          type: [integer, 'null']
        # arrayMin: 5 in the config must clamp to this maxItems.
        tags:
          type: array
          maxItems: 3
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: integer
        role:
          type: string
          enum: [admin, member]
          example: admin
        bio:
          type: string
          examples:
            - Hello
        code:
          type: string
          pattern: '^[a-z]{3}/[0-9]{2}$'
    Order:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [pending, shipped]
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
    Formats:
      type: object
      required:
        - email
        - uuid
        - uuidv4
        - uuidv7
        - guid
        - url
        - httpUrl
        - hostname
        - ipv4
        - ipv6
        - cidrv4
        - cidrv6
        - mac
        - date
        - time
        - dateTime
        - duration
        - ulid
        - nanoid
        - cuid
        - cuid2
        - jwt
        - emoji
        - hex
        - base64
        - base64url
        - e164
        - uriReference
        - idnEmail
        - decimal
        - constructor
        - toString
        - stringInt64
        - numberInt64
      properties:
        email: { type: string, format: email }
        uuid: { type: string, format: uuid }
        uuidv4: { type: string, format: uuidv4 }
        uuidv7: { type: string, format: uuidv7 }
        guid: { type: string, format: guid }
        url: { type: string, format: url }
        httpUrl: { type: string, format: httpUrl }
        hostname: { type: string, format: hostname }
        ipv4: { type: string, format: ipv4 }
        ipv6: { type: string, format: ipv6 }
        cidrv4: { type: string, format: cidrv4 }
        cidrv6: { type: string, format: cidrv6 }
        mac: { type: string, format: mac }
        date: { type: string, format: date }
        time: { type: string, format: time }
        dateTime: { type: string, format: date-time }
        duration: { type: string, format: duration }
        ulid: { type: string, format: ulid }
        nanoid: { type: string, format: nanoid }
        cuid: { type: string, format: cuid }
        cuid2: { type: string, format: cuid2 }
        jwt: { type: string, format: jwt }
        emoji: { type: string, format: emoji }
        hex: { type: string, format: hex }
        base64: { type: string, format: base64 }
        base64url: { type: string, format: base64url }
        e164: { type: string, format: e164 }
        # Formats outside the zod set, and document values that name
        # Object.prototype members, must still mock to a plain value.
        uriReference: { type: string, format: uri-reference }
        idnEmail: { type: string, format: idn-email }
        decimal: { type: string, format: decimal }
        constructor: { type: string, format: constructor }
        toString: { type: string }
        # A numeric format on a non-integer type is not a bigint (zod has no z.int64() here).
        stringInt64: { type: string, format: int64 }
        numberInt64: { type: number, format: int64 }
    Bounds:
      type: object
      required:
        - minOnly
        - maxOnly
        - ratio
        - negativeId
        - code
        - longText
        - openUnit
        - flags
      properties:
        minOnly: { type: integer, minimum: 5000 }
        maxOnly: { type: integer, maximum: 0 }
        ratio: { type: number, maximum: 0.5 }
        negativeId: { type: integer, format: int64, maximum: -5 }
        code: { type: string, maxLength: 3 }
        longText: { type: string, minLength: 50 }
        openUnit: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 0.05 }
        flags:
          type: array
          uniqueItems: true
          minItems: 3
          items: { type: string, enum: [a, b, c] }
    Category:
      type: object
      required:
        - label
        - children
      properties:
        label: { type: string }
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        parent:
          $ref: '#/components/schemas/Category'
    Settings:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Setting'
    Setting:
      type: object
      required:
        - value
      properties:
        value: { type: string }
    AuthError:
      type: object
      required:
        - code
        - error
      properties:
        code: { type: integer }
        error: { type: string }
    Invoice:
      type: object
      required:
        - id
        - lines
        - note
      properties:
        id: { type: integer, format: int64 }
        lines:
          type: array
          items:
            type: object
            required:
              - amount
            properties:
              amount: { type: integer, format: int64 }
        note: { type: string }
    Shapes:
      type: object
      required:
        - meta
        - pair
        - slug
        - shortEmail
        - longEmail
        - shortUrl
        - shortHost
        - pin
      properties:
        shortEmail: { type: string, format: email, maxLength: 12 }
        longEmail: { type: string, format: email, minLength: 40 }
        shortUrl: { type: string, format: uri, maxLength: 16 }
        shortHost: { type: string, format: hostname, maxLength: 8 }
        pin: { type: string, format: password, minLength: 4, maxLength: 6 }
        meta: {}
        pair:
          type: array
          prefixItems:
            - { type: string }
            - { type: integer }
          minItems: 2
          maxItems: 2
        slug: { type: string, pattern: '^[a-z]+$', minLength: 3, maxLength: 5 }
    Person:
      type: object
      properties:
        phone: { type: string }
        nickname: { type: string }
    Contact:
      allOf:
        - $ref: '#/components/schemas/Person'
        - required:
            - phone
    GraphNode:
      type: object
      required:
        - value
        - links
      properties:
        value: { type: string }
        links:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/GraphNode'
              - type: string
    NotAString:
      not:
        type: string
    Constraints:
      type: object
      required:
        - apiUrl
        - domain
        - uuidV8
        - digest
        - dashMac
        - localTime
        - tags
        - kind
        - locale
        - payload
      properties:
        apiUrl: { type: string, x-startsWith: 'https://', x-includes: '/api/', x-endsWith: '.test' }
        domain: { type: string, pattern: '^[a-z]{3,8}\.example\.com$' }
        uuidV8: { type: string, format: uuid, x-uuidVersion: v8 }
        digest: { type: string, format: hash, x-hashAlg: sha256, x-hashEnc: hex }
        dashMac: { type: string, format: mac, x-macDelimiter: '-' }
        localTime: { type: string, format: date-time, x-isoLocal: true }
        tags:
          type: array
          items: { type: string }
          contains: { const: important }
        kind: { type: string, enum: [premium, basic] }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        payload:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema:
            type: object
            required: [theme]
            properties:
              theme: { type: string, enum: [light, dark] }
        feature: { type: string }
      if:
        type: object
        properties:
          kind: { const: premium }
        required: [kind]
      then:
        type: object
        required: [feature]
    Party:
      oneOf:
        - $ref: '#/components/schemas/Member'
        - $ref: '#/components/schemas/Organization'
        - $ref: '#/components/schemas/Individual'
    Member:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    Organization:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Individual:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
    Account:
      type: object
      required: [id]
      properties:
        id: { type: string }
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
    Purchase:
      type: object
      required: [buyer]
      properties:
        buyer:
          $ref: '#/components/schemas/Account'
