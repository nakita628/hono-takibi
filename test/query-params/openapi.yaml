# Every parameter shape the generator supports, as a query parameter: each `type` and
# `format`, once on its own and once as an array. HTTP delivers all of them as strings, so
# what the generated schema has to prove is that each arrives as the right JavaScript type.
#
# `format: binary` is deliberately absent: it emits `z.file()`, which a query string cannot
# carry — OpenAPI scopes it to request bodies.
#
# `/params`    every shape, scalar and array, each optional so a test sends one alone.
#              The `tx_*` parameters are the `x-trim` / `x-toLowerCase` /
#              `x-toUpperCase` / `x-normalize` extensions, alone and paired with a
#              validation format — the pairing takes a `.pipe()` branch so the transform
#              runs before the format's own check.
# `/literals`  `enum` / `const` of every primitive type, a nullable and a `oneOf`.
# `/optional`  absent parameters, and names that are not identifiers.
# `/defaults`  what an absent parameter falls back to.
# `/required`  what happens when a required parameter is missing.
# `/limits`    constraints, on a scalar and on an array.
# `/styles`    the serialisations other than the default `form` + `explode: true`.
# `/objects`   a parameter that is an object, spread over the query in each of the ways
#              OpenAPI serialises one.
# `/absent`    `allowEmptyValue`, and a reference that carries a default.
# `/refs`      a schema behind `$ref`: the component is written for a typed value, so the
#              text is read before it reaches the component.
# `/combinators`  `allOf`, `oneOf`, `anyOf`, `not`, a mixed `enum`, a typeless constraint and
#              a tuple: the text is read once, around the whole schema.
# `/content`   a parameter declared with `content: application/json`, one JSON document.
#
# 生成器が対応するすべてのパラメータ形状を、クエリパラメータとして宣言する。各 `type` と
# `format` を、単独の場合と配列の場合の両方で宣言している。HTTP はすべてを文字列で運ぶため、
# 生成されたスキーマが示すべきことは、各値が正しい JavaScript の型で届くことである。
#
# `format: binary` は意図的に含めていない。`z.file()` として生成されるが、クエリ文字列では
# 運べない。OpenAPI でも、リクエストボディ専用とされている。
#
# `/params`    全形状のスカラーと配列。テストで1つだけ送信できるよう、すべて任意にしている。
#              `tx_*` パラメータは、`x-trim` / `x-toLowerCase` / `x-toUpperCase` /
#              `x-normalize` 拡張である。単独の場合と、検証フォーマットと組み合わせた場合の
#              両方を宣言している。組み合わせた場合は `.pipe()` の分岐を通り、変換が
#              フォーマット検証より先に実行される。
# `/literals`  各プリミティブ型の `enum` / `const`、nullable、`oneOf`。
# `/optional`  省略されたパラメータと、識別子でない名前。
# `/defaults`  省略されたパラメータに適用されるデフォルト値。
# `/required`  必須パラメータが欠落している場合の挙動。
# `/limits`    スカラーと配列に対する制約。
# `/styles`    デフォルトの `form` + `explode: true` 以外のシリアライズ形式。
# `/objects`   オブジェクトであるパラメータ。OpenAPI が定める各シリアライズ形式で、
#              クエリに分散して送られる。
# `/absent`    `allowEmptyValue` と、デフォルト値を持つ参照。
# `/refs`      `$ref` の先にあるスキーマ。コンポーネントは型付きの値を前提としているため、
#              文字列はコンポーネントに渡る前に読み取られる。
# `/combinators`  `allOf`・`oneOf`・`anyOf`・`not`・型混在の `enum`・型なしの制約・タプル。
#              文字列は、スキーマ全体の外側で1度だけ読み取られる。
# `/content`   `content: application/json` で宣言されたパラメータ。1つの JSON 文書である。
openapi: 3.1.0
info:
  title: Query Parameter Matrix
  version: 0.0.0
paths:
  /params:
    get:
      operationId: queryParams
      parameters:
        - { name: integer, in: query, schema: { type: integer } }
        - { name: integer_arr, in: query, schema: { type: array, items: { type: integer } } }
