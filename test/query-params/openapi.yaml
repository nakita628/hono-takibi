# Every parameter shape the generator supports, as a query parameter: each `type` and
# `format`, once on its own and once as an array. HTTP delivers all of them as strings, so
# what the generated schema has to prove is that each arrives as the right JavaScript type.
#
# `format: binary` is deliberately absent: it emits `z.file()`, which a query string cannot
# carry — OpenAPI scopes it to request bodies.
#
# The `tx_*` parameters are the second axis: the `x-trim` / `x-toLowerCase` /
# `x-toUpperCase` / `x-normalize` extensions, alone and paired with a validation format —
# the pairing takes a `.pipe()` branch so the transform runs before the format's own check.
# These assert the value that arrives, not just its type.
openapi: 3.1.0
info:
  title: Query Parameter Matrix
  version: 0.0.0
