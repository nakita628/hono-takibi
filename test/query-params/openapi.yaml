          }
        - { name: base64url, in: query, schema: { type: string, format: base64url } }
        - {
            name: base64url_arr,
            in: query,
            schema: { type: array, items: { type: string, format: base64url } },
          }
        - { name: nanoid, in: query, schema: { type: string, format: nanoid } }
        - {
