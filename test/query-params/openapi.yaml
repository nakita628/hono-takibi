          }
        - { name: duration, in: query, schema: { type: string, format: duration } }
        - {
            name: duration_arr,
            in: query,
            schema: { type: array, items: { type: string, format: duration } },
          }
        - { name: byte, in: query, schema: { type: string, format: byte } }
        - {
            name: byte_arr,
            in: query,
            schema: { type: array, items: { type: string, format: byte } },
          }
        - { name: strpassword, in: query, schema: { type: string, format: password } }
        - {
            name: strpassword_arr,
            in: query,
            schema: { type: array, items: { type: string, format: password } },
          }
        - { name: mac, in: query, schema: { type: string, format: mac } }
        - {
            name: mac_arr,
            in: query,
            schema: { type: array, items: { type: string, format: mac } },
          }
        - { name: e164, in: query, schema: { type: string, format: e164 } }
        - {
            name: e164_arr,
            in: query,
            schema: { type: array, items: { type: string, format: e164 } },
          }
        - { name: creditcard, in: query, schema: { type: string, format: creditCard } }
        - {
            name: creditcard_arr,
            in: query,
            schema: { type: array, items: { type: string, format: creditCard } },
          }
        - { name: iban, in: query, schema: { type: string, format: iban } }
        - {
            name: iban_arr,
            in: query,
            schema: { type: array, items: { type: string, format: iban } },
          }
        - { name: currencycode, in: query, schema: { type: string, format: currencyCode } }
        - {
            name: currencycode_arr,
            in: query,
            schema: { type: array, items: { type: string, format: currencyCode } },
          }
        - { name: ksuid, in: query, schema: { type: string, format: ksuid } }
        - {
            name: ksuid_arr,
            in: query,
            schema: { type: array, items: { type: string, format: ksuid } },
          }
        - { name: xid, in: query, schema: { type: string, format: xid } }
        - {
            name: xid_arr,
            in: query,
            schema: { type: array, items: { type: string, format: xid } },
          }
        - { name: guid, in: query, schema: { type: string, format: guid } }
        - {
            name: guid_arr,
            in: query,
            schema: { type: array, items: { type: string, format: guid } },
          }
        - { name: trim, in: query, schema: { type: string, format: trim } }
        - {
            name: trim_arr,
            in: query,
            schema: { type: array, items: { type: string, format: trim } },
          }
        - { name: tx_trim, in: query, schema: { type: string, x-trim: true } }
        - { name: tx_lower, in: query, schema: { type: string, x-toLowerCase: true } }
        - { name: tx_upper, in: query, schema: { type: string, x-toUpperCase: true } }
        - { name: tx_normalize, in: query, schema: { type: string, x-normalize: NFKC } }
        - { name: tx_email_trim, in: query, schema: { type: string, format: email, x-trim: true } }
        - { name: tx_uuid_trim, in: query, schema: { type: string, format: uuid, x-trim: true } }
        - {
            name: tx_email_lower,
            in: query,
            schema: { type: string, format: email, x-toLowerCase: true },
          }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  # A numeric or boolean `enum` / `const` and a numeric composition: each names a typed
  # value, and the string on the wire has to be coerced before the literal is matched.
  # 数値・真偽値の `enum` / `const` と、数値を含む合成スキーマ。いずれも型付きの値を指す
  # ため、ワイヤ上の文字列は、リテラルと照合する前に coerce しなければならない。
  /literals:
    get:
      operationId: queryLiterals
      parameters:
        - { name: ienum, in: query, schema: { type: integer, enum: [1, 2, 3] } }
        - { name: nenum, in: query, schema: { type: number, enum: [1.5, 2.5] } }
        - { name: benum, in: query, schema: { type: boolean, enum: [true] } }
        - { name: iconst, in: query, schema: { type: integer, const: 7 } }
        - { name: senum, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: sconst, in: query, schema: { type: string, const: fixed } }
        - { name: numericsenum, in: query, schema: { type: string, enum: ['1', '02', 'true'] } }
        - { name: inull, in: query, schema: { type: [integer, 'null'] } }
        - {
            name: ioneof,
            in: query,
            schema: { oneOf: [{ type: integer }, { type: string, enum: [all] }] },
          }
        - {
            name: ienum_arr,
            in: query,
            schema: { type: array, items: { type: integer, enum: [1, 2, 3] } },
          }
        - {
            name: senum_arr,
            in: query,
            schema: { type: array, items: { type: string, enum: [asc, desc] } },
          }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /optional:
    get:
      operationId: queryOptional
      parameters:
        - { name: int_opt, in: query, schema: { type: integer } }
        - { name: int64_opt, in: query, schema: { type: integer, format: int64 } }
        - { name: num_opt, in: query, schema: { type: number } }
        - { name: bool_opt, in: query, schema: { type: boolean } }
        - { name: str_opt, in: query, schema: { type: string } }
        - { name: uuid_opt, in: query, schema: { type: string, format: uuid } }
        - { name: arr_opt, in: query, schema: { type: array, items: { type: integer } } }
        # Names that are not JavaScript identifiers.
        # JavaScript の識別子でない名前。
        - { name: page-size, in: query, schema: { type: integer } }
        - { name: 'filter[name]', in: query, schema: { type: string } }
        - { name: '$top', in: query, schema: { type: integer } }
        - { name: user.id, in: query, schema: { type: integer } }
        - { name: 'ids[]', in: query, schema: { type: array, items: { type: integer } } }
        # Differs from `int_opt` by case alone: names are case-sensitive.
        # `int_opt` とは大文字小文字だけが異なる。名前は大文字小文字を区別する。
        - { name: Int_Opt, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /defaults:
    get:
      operationId: queryDefaults
      parameters:
        - { name: int_def, in: query, schema: { type: integer, default: 20 } }
        - { name: int64_def, in: query, schema: { type: integer, format: int64, default: 5 } }
        - { name: num_def, in: query, schema: { type: number, default: 0.5 } }
        - { name: bool_def, in: query, schema: { type: boolean, default: false } }
        - { name: bool_def_true, in: query, schema: { type: boolean, default: true } }
        - { name: str_def, in: query, schema: { type: string, default: fallback } }
        - { name: enum_def, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - {
            name: arr_def,
            in: query,
            schema: { type: array, items: { type: string }, default: [] },
          }
        - {
            name: arr_int_def,
            in: query,
            schema: { type: array, items: { type: integer }, default: [1, 2] },
          }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /required:
    get:
      operationId: queryRequired
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
        - { name: big, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: flag, in: query, required: true, schema: { type: boolean } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - {
            name: tags,
            in: query,
            required: true,
            schema: { type: array, items: { type: integer } },
          }
        # `required: false` written out is the same as leaving `required` off.
        # `required: false` を明記した場合も、`required` を省略した場合と同じである。
        - { name: note, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /limits:
    get:
      operationId: queryLimits
      parameters:
        - { name: range, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - {
            name: exclusive,
            in: query,
            schema: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 },
          }
        - { name: multiple, in: query, schema: { type: integer, multipleOf: 5 } }
        - {
            name: int64range,
            in: query,
            schema: { type: integer, format: int64, minimum: 1, maximum: 100 },
          }
        - { name: length, in: query, schema: { type: string, minLength: 2, maxLength: 4 } }
        - { name: pattern, in: query, schema: { type: string, pattern: '^[a-z]+-\d{1,3}$' } }
        - {
            name: items,
            in: query,
            schema: { type: array, items: { type: integer }, minItems: 2, maxItems: 3 },
          }
        - {
            name: unique,
            in: query,
            schema: { type: array, items: { type: integer }, uniqueItems: true },
          }
        - {
            name: ranged_items,
            in: query,
            schema: { type: array, items: { type: integer, minimum: 1, maximum: 9 } },
          }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
  /styles:
    get:
      operationId: queryStyles
      parameters:
        - name: csv
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: pipes
          in: query
          style: pipeDelimited
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: spaces
          in: query
          style: spaceDelimited
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              name: { type: string }
              age: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Fields' }
components:
  responses:
    Fields:
      description: Every validated parameter, by name, as the runtime typeof and the text of its value.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
