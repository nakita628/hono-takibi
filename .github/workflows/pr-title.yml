name: PR title

# Pull requests are squash-merged with their title as the commit message, and release-please
# reads those messages to decide the next version and write the changelog (release-pr.yml).
# A title that is not a Conventional Commit would be left out of both, so it is checked here.
# The types are the ones .github/pull_request_template.md lists, plus `revert`.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error::The pull request title must be a Conventional Commit, e.g. 'fix(zod): keep .nullable() on a \$ref'. Got: $TITLE"
          exit 1
