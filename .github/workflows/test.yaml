name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1

      - uses: voidzero-dev/setup-vp@v1.12.0
        with:
          node-version: '22'
          cache: true

      # Not `vp install`: it left the test/ workspace importer without node_modules
      # on CI (missing .bin shims and deps at vitest globalSetup). A full pnpm
      # install links every workspace importer.
      - run: corepack enable && pnpm install --frozen-lockfile

      - run: vp run hono-takibi#build

      - run: vp test --coverage

      - run: vp check
