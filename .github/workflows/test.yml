name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # test/ drives the packaged CLI from dist, so the library is built first.
      - run: vp run --filter ./packages/hono-takibi build

      - run: vp run --filter ./packages/hono-takibi test

      - run: vp run --filter ./test test

      - run: vp run check
