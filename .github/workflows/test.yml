name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it. Runs on main are
# never cancelled: each commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          cache: true

      - run: vp install --frozen-lockfile

      # test/ drives the packaged CLI from dist, so the library is built first.
      - run: vp run --filter ./packages/hono-takibi build

      - run: vp run --filter ./packages/hono-takibi test

      - run: vp run --filter ./test test

      - run: vp run check
