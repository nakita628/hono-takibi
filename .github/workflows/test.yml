name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # test/ drives the packaged CLI from dist, so the library is built first.
      - run: vp run --filter ./packages/hono-takibi build

      - run: vp run --filter ./packages/hono-takibi test

      - run: vp run --filter ./test test

      - run: vp run check
