name: Test

on:
  push:
    branches:
      - main
  pull_request:
    # The files the release pull request changes, and nothing else it does.
    paths-ignore:
      - '.release-please-manifest.json'
      - 'packages/hono-takibi/CHANGELOG.md'
      - 'packages/hono-takibi/package.json'
  # The release pull request is opened with GITHUB_TOKEN, and a `pull_request` run of such a
  # pull request waits for someone to approve it ("Approve workflows to run"). So no run is
  # made for it: it changes only the files `paths-ignore` lists, and the release workflow
  # dispatches this one on its branch instead, which needs no approval.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it, and so does a new
# dispatch on a branch. Runs on main are never cancelled: each commit there keeps its own
# result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          cache: true

      - run: vp install --frozen-lockfile

      # test/ drives the packaged CLI from dist, so the library is built first.
      - run: vp run --filter ./packages/hono-takibi build

      - run: vp run --filter ./packages/hono-takibi test

      - run: vp run --filter ./test test

      - run: vp run check

  # The check of a dispatched run stays on the commit and is not counted on a pull request,
  # so the `test` the main ruleset requires would never be met on the release pull request
  # (release.yml). A commit status is counted, so the result is written as one.
  report:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Write the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/statuses/$SHA" \
            -f state=success -f context=test -f target_url="$RUN_URL"
