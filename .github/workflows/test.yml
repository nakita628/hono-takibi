name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '22'
          cache: true

      # Not `vp install`: it left the test/ workspace importer without node_modules
      # on CI (missing .bin shims and deps at vitest globalSetup). A full pnpm
      # install links every workspace importer.
      - run: corepack enable && pnpm install --frozen-lockfile

      - run: vp run hono-takibi#build

      - run: vp run coverage

      - run: vp run check
