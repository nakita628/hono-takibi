name: Website

# Playwright drives the built site (playground included), which is slow and only worth running
# when the site itself changed. The path filter keeps the job off every other pull request; the
# workflow file is listed so that a change to this job runs it too.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # The site imports hono-takibi from its dist, so the library is built first.
      - run: vp run --filter ./packages/hono-takibi build

      # setup-vp puts `vp` on PATH, not `pnpm`; corepack provides pnpm for `exec`.
      - run: corepack enable && pnpm -F ./website exec playwright install --with-deps chromium

      # playwright.config.ts builds the site and serves it on :4173 before the tests.
      - run: vp run --filter ./website test:e2e
        env:
          CI: '1'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7
