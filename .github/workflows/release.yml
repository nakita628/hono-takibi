name: release

# release-please does the bookkeeping, in the two steps its documentation describes.
#
# On every push to main it keeps one pull request open that bumps the version in
# packages/hono-takibi/package.json and writes packages/hono-takibi/CHANGELOG.md from the
# Conventional Commits since the last tag: `fix` is a patch, `feat` a minor, and a breaking
# change a minor too while the version is 0.x (release-please-config.json). Only commits that
# touch packages/hono-takibi count, so a website or CI change opens nothing.
#
# Merging that pull request is the release decision. The push it makes runs this workflow
# again: release-please tags the merge commit, writes the GitHub release from the changelog
# section, and `publish` sends that tag to npm. The main ruleset requires `test` and `lint` on
# every pull request, the release one included, so nothing is tested a second time here.
#
# The release pull request is written with GITHUB_TOKEN, and what that token does starts no
# `pull_request` run: `test` and `lint` would never report on it. `workflow_dispatch` is the
# exception GitHub makes, so this workflow dispatches both on the branch of the pull request
# whenever release-please opens or updates it. A check belongs to the commit, so the runs
# report on the pull request as its own would.
#
# If `publish` fails, re-run the failed job: the tag and the release are already written and
# the job publishes the same tag again.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      # To dispatch Test and Lint on the release pull request.
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs['packages/hono-takibi--release_created'] }}
      tag: ${{ steps.release.outputs['packages/hono-takibi--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `pr` is set when release-please opened or updated the pull request in this run; one
      # it left as it was already has its checks.
      - name: Run Test and Lint on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          gh workflow run test.yml --ref "$BRANCH"
          gh workflow run lint.yml --ref "$BRANCH"

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag, not the pushed commit: a run that waited in the queue may release a merge
      # that an earlier push made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run hono-takibi#build

      # vp has no publish command; pnpm publishes with npm provenance (id-token: write).
      - run: corepack enable && pnpm -F hono-takibi publish --no-git-checks
