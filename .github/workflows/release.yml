name: release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check unpublished version
        id: ver
        run: |
          CUR=$(jq -r .version packages/hono-takibi/package.json)
          npm view "hono-takibi@$CUR" version >/dev/null 2>&1 || echo "version=$CUR" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.unpublished
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F hono-takibi build

      - run: pnpm -F hono-takibi publish --no-git-checks

  release:
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(jq -r .version packages/hono-takibi/package.json)
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo "release v$VERSION already exists; skip"; exit 0; }
          gh release create "v$VERSION" --generate-notes --target "$TARGET"
