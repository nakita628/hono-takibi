name: Lint

# The gates that need no build, as `pnpm lint` runs them locally: the workflows themselves
# (actionlint for the syntax, zizmor for the security posture) and knip for unused files,
# dependencies and exports (knip.jsonc). actionlint and zizmor are installed first, and
# LINT_ACTIONS_REQUIRED turns the script's "not installed" note into a failure — here only:
# Test reaches the same script through `vp run check` and skips them, as a machine without
# the tools does.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it. Runs on main are
# never cancelled: each commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LINT_ACTIONS_REQUIRED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          cache: true

      - run: vp install --frozen-lockfile

      # Neither tool is an npm dependency, so Renovate does not see them and the versions are
      # pinned here by hand, each with the sha256 of its linux x86_64 release tarball: the
      # binary is taken from the tool's own GitHub release and checked before it is unpacked.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C /usr/local/bin actionlint

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.0
          ZIZMOR_SHA256: ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C /usr/local/bin zizmor

      # setup-vp puts `vp` on PATH, not `pnpm`; `vp run` hands its bundled pnpm to the script.
      - run: vp run lint
