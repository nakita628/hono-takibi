packages:
  - apps/*
  - packages/*
  - test
  - website
# TypeSpec ships every @typespec/* package in one release, so each workspace package takes its
# version from this catalog (`"catalog:"`) and Renovate moves them together (see renovate.json).
# Strict mode makes `pnpm add` refuse a version outside the catalog.
catalogMode: strict
catalog:
  '@typespec/bundler': ^0.6.1
  '@typespec/compiler': ^1.16.0
  '@typespec/events': ^0.86.0
  '@typespec/http': ^1.16.0
  '@typespec/json-schema': ^1.16.0
  '@typespec/openapi': ^1.16.0
  '@typespec/openapi3': ^1.16.0
  '@typespec/playground': ^0.17.1
  '@typespec/rest': ^0.86.0
  '@typespec/sse': ^0.86.0
  '@typespec/streams': ^0.86.0
  '@typespec/versioning': ^0.86.0
  '@typespec/xml': ^0.86.0
  cf: 1.0.0-beta.12
  wrangler: ^4.144.0
allowBuilds:
  # Telemetry postinstall pulled in through @typespec/playground -> swagger-ui-dist;
  # nothing to build, so it never runs.
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@effect/platform-node-shared@4.0.0'
  - '@effect/platform-node@4.0.0'
  - effect@4.0.0
