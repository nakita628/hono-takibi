packages:
  - apps/*
  - packages/*
  - test
  - website
# TypeSpec ships every @typespec/* package in one release, so each workspace package takes its
# version from this catalog (`"catalog:"`) and Renovate moves them together (see renovate.json).
# Strict mode makes `pnpm add` refuse a version outside the catalog.
catalogMode: strict
catalog:
  '@typespec/bundler': ^0.6.1
  '@typespec/compiler': ^1.17.0
  '@typespec/events': ^0.87.0
  '@typespec/http': ^1.17.0
  '@typespec/json-schema': ^1.17.0
  '@typespec/openapi': ^1.17.0
  '@typespec/openapi3': ^1.17.0
  '@typespec/playground': ^0.18.0
  '@typespec/rest': ^0.87.0
  '@typespec/sse': ^0.87.0
  '@typespec/streams': ^0.87.0
  '@typespec/versioning': ^0.87.0
  '@typespec/xml': ^0.87.0
  cf: 1.0.0-beta.28
  oxc-parser: ^0.157.0
  # The browser build of oxc-parser imports this binding and oxc-parser does not list it
  # itself; the website's playground needs it, at the version of oxc-parser.
  '@oxc-parser/binding-wasm32-wasip1': ^0.157.0
  # oxc-transform strips the types off the playground's generated mock before the browser runs
  # it; its browser build imports this binding the same way oxc-parser does.
  oxc-transform: ^0.157.0
  '@oxc-transform/binding-wasm32-wasip1': ^0.157.0
  wrangler: ^4.158.0
  # What the playground's Mock view runs the generated server against; hono-takibi's own
  # devDependencies name the same releases, which are the ones the generator targets.
  '@faker-js/faker': ^10.6.0
  '@hono/zod-openapi': ^1.6.3
  '@scalar/api-reference': ^1.77.0
  hono: ^4.13.17
  zod: ^4.6.7
overrides:
  # @oxc-parser/binding-wasm32-wasip1 0.157 pins @emnapi/core and @emnapi/runtime at
  # 2.0.0-alpha.6 but takes @napi-rs/wasm-runtime ~1.2.6, whose emnapi plugins are written for
  # 2.0.0-beta.2 (they read `addonModule`, which alpha.6 still calls `napiModule`). In the
  # browser the parser then fails to load with "Cannot set properties of undefined (setting
  # 'initWorker')" and the playground never generates. 1.2.5 is the last release written for
  # alpha.6; drop this once the binding moves its emnapi pins to a beta the runtime matches.
  '@oxc-parser/binding-wasm32-wasip1>@napi-rs/wasm-runtime': 1.2.5
  '@oxc-transform/binding-wasm32-wasip1>@napi-rs/wasm-runtime': 1.2.5
allowBuilds:
  # Telemetry postinstall pulled in through @typespec/playground -> swagger-ui-dist;
  # nothing to build, so it never runs.
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@effect/platform-node-shared@4.1.2'
  - '@effect/platform-node@4.1.2'
  - effect@4.1.2
